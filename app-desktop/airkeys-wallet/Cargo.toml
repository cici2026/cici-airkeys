[package]
name = "airkeys-wallet"
version = "0.1.0"
edition = "2024"

# This crate is deliberately NOT a member of the rust/ workspace.
#
# gpui is a git dependency that pulls a large native tree (Vulkan, Wayland/X11,
# fontconfig); making it a workspace member would put all of it in the way of
# `cargo test -p airkeys-core`, which is the suite that has to stay fast enough
# to run on every save. The core is consumed here by path, like any other
# dependency.

[dependencies]
# `wayland` and `x11` are NOT optional extras. gpui_platform defaults to both,
# but Zed's own workspace pins it `default-features = false`, so a git
# dependency inherits neither and every Linux run dies at
# `unreachable!("At least one of the \"wayland\" or \"x11\" features must be
# enabled")`. Both are on, as in Zed's crates/zed/Cargo.toml: the choice is made
# at runtime from WAYLAND_DISPLAY, so dropping x11 would leave an X session with
# no backend. The features are inert on macOS and Windows, where gpui_platform's
# Linux backend is not a dependency at all.
#
# PINNED to a revision, not tracking master. gpui is pre-1.0 and unversioned on
# crates.io; an unpinned git dependency means `cargo update` can change the UI
# framework's API underneath a green build. Bump this deliberately, re-read
# "Known gpui quirks" in the README, and re-run the suite.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c97b7c0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c97b7c0", features = [
    "font-kit",
    "wayland",
    "x11",
] }

# Desktop has no download-size budget, so every locale catalog compiles in and
# switching language needs no I/O.
#
# `crux` is ON here — and this is the interesting difference from the mobile
# shells. Desktop is a Rust runtime, so it links the state machines directly and
# needs no FFI layer at all: `shell_host.rs` drives `Core<Unlock>` in-process.
# Web reaches the same machines through wasm; iOS and Android do not link them
# at all (see airkeys-core-uniffi's Cargo.toml).
airkeys-core = { path = "../../rust/crates/airkeys-core", features = [
    "crux",
    "i18n-all",
] }
# Must stay in lockstep with the workspace pin in rust/Cargo.toml: `shell_host`
# holds a `Core<A>` and a `Request<ShellOperation>` directly, so two crux
# versions in one binary would be two incompatible `Effect` types with the same
# name — and the error message says so only after a long detour.
crux_core = "0.19"

# Embeds the application icon into airkeys-wallet.exe as resource id 1, which is
# where gpui's LoadImageW looks for it.
#
# Declared unconditionally rather than under
# [target.'cfg(windows)'.build-dependencies], because that section is resolved
# against the HOST — a Linux-hosted cross build to Windows would skip it and
# silently produce an icon-less executable. build.rs gates on the TARGET instead.
[build-dependencies]
winresource = "0.1"
