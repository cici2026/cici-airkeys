name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a recovery phrase that holds funds**, here or in a screenshot. Use the test
        phrase (`abandon` eleven times, then `about`) to reproduce. Anything that could cost
        someone funds is a [security report](https://github.com/mondaylabsltd/airkeys/security/advisories/new), not an issue.
  - type: dropdown
    id: part
    attributes:
      label: Where
      options:
        - Android app
        - iOS app
        - Web app
        - Browser extension
        - Core / protocol
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The app's version (the welcome screen shows it) or the commit.
  - type: input
    id: device
    attributes:
      label: Phone, browser and OS
      placeholder: Pixel 8, Android 15 · Chrome 141 on macOS 26
  - type: checkboxes
    id: phrase
    attributes:
      label: Recovery phrases
      options:
        - label: Nothing in this report reveals a recovery phrase that holds funds.
          required: true
