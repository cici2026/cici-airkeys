name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (core/rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: The web app's test vectors match the core
        run: |
          cargo run -q --release -p airkeys-wallet --example vectors > "$RUNNER_TEMP/vectors.json"
          node -e 'require("assert").deepStrictEqual(require(process.argv[1]), require(process.argv[2]))' \
            "$RUNNER_TEMP/vectors.json" "$GITHUB_WORKSPACE/app-web/airkeys.app/src/lib/vectors.json"
      - name: Every app has the core's version
        working-directory: .
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
          grep -q "versionName = \"$v\"" app-android/Airkeys/app/build.gradle.kts
          grep -q "MARKETING_VERSION: \"$v\"" app-ios/project.yml
          grep -q "\"version\": \"$v\"" app-web/airkeys.app/package.json

  msrv:
    name: Core on its minimum Rust (rust-version)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.90 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo +1.90 check --workspace --all-targets

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-web/airkeys.app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - run: bun run extension

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # the app compiles with 17; Gradle itself runs on 21 (gradle-daemon-jvm.properties)
          java-version: |
            17
            21
      - name: Toolchain and cargo-ndk
        working-directory: core
        run: |
          rustup toolchain install || rustup show
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (the core for every ABI, then the app) and lint
        working-directory: app-android/Airkeys
        run: ./gradlew :app:assembleDebug :app:lintDebug
