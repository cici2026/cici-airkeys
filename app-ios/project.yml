# XcodeGen spec (`xcodegen` writes Airkeys.xcodeproj; it is not committed). It is also the one
# source of Airkeys/Resources/Info.plist, which xcodegen writes: edit the properties here.
# Build the Rust core first: ../core/scripts/build-ios.sh. Signing: Config/Local.xcconfig.
name: Airkeys
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  AirkeysCoreKit:
    path: AirkeysCoreKit
targets:
  Airkeys:
    type: application
    platform: iOS
    sources:
      - path: Airkeys
    dependencies:
      - package: AirkeysCoreKit
        product: AirkeysCore
    info:
      path: Airkeys/Resources/Info.plist
      properties:
        CFBundleDisplayName: Airkeys
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Airkeys reads codes with the camera: the web app's, or your SeedQR. Images never leave this phone and are not stored."
        NSBluetoothAlwaysUsageDescription: Airkeys checks that Bluetooth is off — it works only on a phone with every radio off. It never uses Bluetooth.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEYS_BUNDLE_ID)
        PRODUCT_NAME: Airkeys
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  AirkeysUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AirkeysUITests
    dependencies:
      - target: Airkeys
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEYS_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Airkeys:
    build:
      targets:
        Airkeys: all
    test:
      targets:
        - AirkeysUITests
    run:
      config: Debug
    archive:
      config: Release
