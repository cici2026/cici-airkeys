# XcodeGen spec (`xcodegen` writes Airkeys.xcodeproj; it is not committed).
# Build the Rust core first: ../core/scripts/build-ios.sh. Or scripts/run.sh for everything.
name: Airkeys
options:
  bundleIdPrefix: app.airkeys
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: F9W689P9NE
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  AirkeysCoreKit:
    path: AirkeysCoreKit
targets:
  Airkeys:
    type: application
    platform: iOS
    sources:
      - path: Airkeys
    dependencies:
      - package: AirkeysCoreKit
        product: AirkeysCore
    info:
      path: Airkeys/Resources/Info.plist
      properties:
        CFBundleDisplayName: Airkeys
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSCameraUsageDescription: Airkeys reads the code on the web app's screen with the camera. Nothing leaves this phone.
        NSBluetoothAlwaysUsageDescription: Airkeys checks that Bluetooth is off — it works only on a phone with every radio off. It never uses Bluetooth.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.airkeys
        PRODUCT_NAME: Airkeys
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  AirkeysUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AirkeysUITests
    dependencies:
      - target: Airkeys
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.airkeys.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Airkeys:
    build:
      targets:
        Airkeys: all
    test:
      targets:
        - AirkeysUITests
    run:
      config: Debug
    archive:
      config: Release
