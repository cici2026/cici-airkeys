# XcodeGen spec (`xcodegen` writes Airkeys.xcodeproj; it is not committed). It is also the one
# source of Airkeys/Resources/Info.plist, which xcodegen writes: edit the properties here.
# Build the Rust core first: ../core/scripts/build-ios.sh. Signing: Config/Local.xcconfig.
name: Airkeys
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  AirkeysCoreKit:
    path: AirkeysCoreKit
targets:
  Airkeys:
    type: application
    platform: iOS
    sources:
      - path: Airkeys
    dependencies:
      - package: AirkeysCoreKit
        product: AirkeysCore
    info:
      path: Airkeys/Resources/Info.plist
      properties:
        CFBundleDisplayName: Airkeys
        CFBundleDevelopmentRegion: en
        # the languages Airkeys speaks: iOS offers them in Settings › Airkeys › Language, and the
        # shell follows the one chosen (Airkeys/Resources/zh-Hans.lproj: the permission prompts)
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Airkeys reads the web app's codes and your SeedQR with the camera. Images are not stored and never leave this phone."
        NSBluetoothAlwaysUsageDescription: Airkeys checks that Bluetooth is off, as it works only with every radio off. It never uses Bluetooth.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEYS_BUNDLE_ID)
        PRODUCT_NAME: Airkeys
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  AirkeysUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AirkeysUITests
    dependencies:
      - target: Airkeys
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEYS_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Airkeys:
    build:
      targets:
        Airkeys: all
    test:
      targets:
        - AirkeysUITests
    run:
      config: Debug
    archive:
      config: Release
