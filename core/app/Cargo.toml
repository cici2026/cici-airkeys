[package]
name = "airkeys-app"
description = "The Airkeys phone app as a Crux core: every screen, rule and string, plus the runtime that the iOS and Android shells drive through uniffi (Lumen Code send and receive included)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "airkeys"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
airkeys-wallet = { workspace = true }
crux_core = { workspace = true }
uniffi = { workspace = true }
lumen-code = { workspace = true }
# QR codes in (a SeedQR); pure Rust, a port of quirc
rqrr = { version = "0.11", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# examples/read_screens.rs decodes screenshots; never part of the app
png = "0.18"
# writes QR codes for the SeedQR tests
qrcode = { version = "0.14", default-features = false }
