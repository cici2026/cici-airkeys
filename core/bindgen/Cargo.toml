[package]
name = "airkeys-bindgen"
description = "uniffi's binding generator for the Airkeys core: writes the Swift and Kotlin bindings at build time."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
