[workspace]
resolver = "2"
members = [
  "crates/airkeys-core",
  "crates/airkeys-core-uniffi",
  "crates/airkeys-core-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# Single source of truth for versions.
#
# NEVER bump uniffi alone: the Kotlin and Swift bindings are checksum-coupled to
# the version that generated them, so both must regenerate together or calls
# fail at run time with a checksum mismatch. Same rule for wasm-bindgen and the
# committed `pkg-web/` artifact.
[workspace.dependencies]
airkeys-core = { path = "crates/airkeys-core" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
base64 = "0.22"

# Portable business state machines. Behind airkeys-core's default-OFF `crux`
# feature: the uniffi bindings never compile it, so the iOS static library and
# the Android .so stay byte-identical without it.
crux_core = "0.19"
# TypeScript mirrors of the Core<->Shell wire types, generated behind the
# `bindings` feature. Never a runtime dependency.
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

uniffi = "0.32.0"
wasm-bindgen = "0.2.126"
serde-wasm-bindgen = "0.6.5"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
