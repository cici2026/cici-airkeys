[package]
name = "airkeys-core-uniffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "uniffi shell over airkeys-core: Kotlin (Android) + Swift (iOS) bindings."

[lib]
name = "airkeys_core_uniffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
# NOTE the feature list: `i18n-en` only, and NOT `crux`.
#
# Native ships the fallback catalog compiled in so the very first screen has
# words before anything is fetched; the rest arrive as JSON through
# `Catalog::from_json`, exactly like web.
#
# `crux` stays off so the state machines are not in this dependency graph at
# all — the iOS static library and the Android .so cannot change when a machine
# does. Verify, do not assume:
#   cargo tree -p airkeys-core-uniffi | grep -c crux   # must be 0
airkeys-core = { workspace = true, features = ["i18n-en"] }
uniffi = { workspace = true, features = ["cli"] }
thiserror = { workspace = true }
