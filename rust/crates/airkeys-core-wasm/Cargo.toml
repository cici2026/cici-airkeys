[package]
name = "airkeys-core-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "wasm-bindgen shell over airkeys-core for the web app."

[lib]
crate-type = ["cdylib"]

[dependencies]
# ZERO locale features, deliberately and permanently.
#
# The i18n ENGINE is nearly free here; CATALOGS are the entire cost, and
# embedding them LOSES over the wire even for a single locale — base64-wrapping
# defeats compression on exactly the data type that compresses best. The web
# route therefore fetches `/i18n/<lng>.json` on demand and hands it to
# `Catalog::from_json`, which is also the only shape that delivers the actual
# requirement: a Japanese reader downloads ja + en, not every locale that exists.
#
# `crux` IS enabled here. Web and desktop are the runtimes that execute the
# state machines; `airkeys-core-uniffi` deliberately does not turn it on, so the
# iOS/Android binaries never link the framework:
#   cargo tree -p airkeys-core-uniffi | grep -c crux   # must stay 0
#   cargo tree -p airkeys-core-wasm   | grep -c crux   # must stay > 0
airkeys-core = { workspace = true, features = ["crux"] }
wasm-bindgen = { workspace = true }
crux_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
