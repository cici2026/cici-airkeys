[package]
name = "airkeys-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Airkeys shared computation core: pure, correctness-critical parsing/encoding/hashing/assembly plus the portable state machines. No I/O, no FFI deps."

[lib]
crate-type = ["lib"]

[features]
default = []

# Portable business state machines (`src/app/`).
#
# DEFAULT OFF, and that is the whole point: with the feature off `crux_core` is
# not in the dependency graph at all, so `airkeys-core-uniffi` — and therefore
# the iOS static library and the Android .so — cannot change when a machine
# does. The wasm shell and the desktop app turn it on, because both are Rust
# runtimes that can execute it.
#
# Verify, do not assume:
#   cargo tree -p airkeys-core-uniffi | grep -c crux   # must be 0
#   cargo tree -p airkeys-core-wasm   | grep -c crux   # must be > 0
crux = ["dep:crux_core"]

# TypeScript mirrors of the wire types, emitted by
# `src/bin/generate_bindings.rs`. Build-time only.
bindings = ["dep:ts-rs", "crux"]

# Per-locale translation catalogs.
#
# The DEFAULT is deliberately ZERO locales: the engine plus the shared path
# table only. A catalog compiled into the wasm module costs more over the wire
# than the same catalog fetched as JSON — base64-wrapping defeats compression on
# exactly the data type that compresses best — and it is the wrong shape besides:
# a Japanese reader should download ja + en, not every locale that exists.
#
# Web therefore fetches `/i18n/<lng>.json` at runtime and hands it to
# `Catalog::from_json`. Desktop and native have no size budget and compile in
# what they ship (`i18n-all`).
#
# `i18n-all` is also what the conformance suite needs: every locale resident so
# the parity tests can replay the whole corpus. NEVER enable it for a
# wasm32-unknown-unknown build.
i18n-en = []
i18n-zh = []
i18n-ja = []
i18n-all = ["i18n-en", "i18n-zh", "i18n-ja"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
crux_core = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

[[bin]]
name = "generate_bindings"
path = "src/bin/generate_bindings.rs"
required-features = ["bindings"]

[dev-dependencies]
serde_json = { workspace = true }
